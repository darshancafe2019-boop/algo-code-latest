name: Quant.OS Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - deploy/*
      - feature/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Security & Leak Prevention ───────────────────────────────────────────
  security-audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets or Environment Credentials Tracked
        run: |
          echo "[+] Auditing repository for forbidden credential files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E "(\.env|\.db$|\.sqlite$|\.pem$|\.key$|quantos_supervisor\.lock)" | grep -vE "(^|/)\.env\.(example|sample|template)$" || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "[!] SECURITY ALERT: Sensitive files detected in Git tree:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "[✓] Git tree clean. No credential files tracked."

      - name: Verify Trading Mode Safety Defaults
        run: |
          echo "[+] Validating institutional risk safety settings..."
          # Ensure repository code enforces TRADING_MODE=PAPER and LIVE_TRADING_ENABLED=false by default
          python3 -c "
          from pathlib import Path
          cfg = Path('src/config.py').read_text()
          assert 'LIVE_TRADING_ENABLED = os.getenv(\"LIVE_TRADING_ENABLED\", \"false\").lower() == \"true\"' in cfg
          assert 'MASTER_LIVE_TRADING = os.getenv(\"MASTER_LIVE_TRADING\", \"false\").lower() == \"true\"' in cfg
          print('[✓] Fail-closed trading guardrails verified in config.py')
          "

  # ── 2. Backend Validation Suite ─────────────────────────────────────────────
  backend-validation:
    name: Backend Tests & Database Compatibility
    runs-on: ubuntu-latest
    needs: security-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: quantos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Health & Blueprint Registration Tests
        env:
          TRADING_MODE: PAPER
          LIVE_TRADING_ENABLED: "false"
          MASTER_LIVE_TRADING: "false"
          FORCE_SQLITE: "true"
        run: |
          python -c "
          from dashboard import app
          client = app.test_client()
          res = client.get('/health/live')
          assert res.status_code == 200, f'Expected 200 from /health/live, got {res.status_code}'
          print('[✓] /health/live response verified:', res.get_json().get('status'))
          # Verify bot_wizard_blueprint is registered
          rules = [r.rule for r in app.url_map.iter_rules()]
          assert '/api/bots' in rules, 'Expected /api/bots from bot_wizard_blueprint to be registered'
          print('[✓] bot_wizard_blueprint is successfully registered.')
          import os; os._exit(0)
          "

      - name: Run Targeted Audit & Repair Verification Test Suite
        env:
          TRADING_MODE: PAPER
          LIVE_TRADING_ENABLED: "false"
          MASTER_LIVE_TRADING: "false"
          FORCE_SQLITE: "true"
        run: |
          python tests/test_audit_repair_verification.py

      - name: Run Database Migration and Schema Verification Against Test PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/quantos_test
        run: |
          echo '[+] Running migration dry-run against isolated PostgreSQL service...'
          python scripts/migrate_sqlite_to_postgres.py --dry-run --pg-url postgresql://postgres:testpassword@localhost:5432/quantos_test
          echo '[+] Running live schema and data migration against isolated PostgreSQL service...'
          python scripts/migrate_sqlite_to_postgres.py --pg-url postgresql://postgres:testpassword@localhost:5432/quantos_test
          echo '[+] Running post-migration verification against isolated PostgreSQL service...'
          python scripts/migrate_sqlite_to_postgres.py --verify-only --pg-url postgresql://postgres:testpassword@localhost:5432/quantos_test
          echo '[✓] PostgreSQL migration and data integrity verified successfully.'

  # ── 3. Frontend Validation Suite ────────────────────────────────────────────
  frontend-validation:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Verification (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Run Next.js Production Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
        run: npm run build

  # ── 4. Deployment Approval Gate ─────────────────────────────────────────────
  deployment-gate:
    name: Deployment Readiness Gate
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy/')
    steps:
      - name: Verify Release Ready
        run: |
          echo "=========================================================="
          echo "  [✓] All Security, Backend, and Frontend Checks Passed"
          echo "  [✓] Repository is certified for Render & Vercel deployment"
          echo "=========================================================="
