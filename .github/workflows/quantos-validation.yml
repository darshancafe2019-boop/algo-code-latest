name: Quant.OS Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quantos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRADING_MODE: PAPER
  PAPER_TRADING: "true"
  LIVE_TRADING: "false"
  LIVE_TRADING_ENABLED: "false"
  MASTER_LIVE_TRADING: "false"
  GLOBAL_TRADING_KILL_SWITCH: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app market_data market_data_gateway src dashboard.py

      - name: Run Python tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
