name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier instance from sleeping (15-min idle timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Probe
        run: |
          curl -s -f -m 30 https://algo-code-latest.onrender.com/health/live || echo "Render ping returned non-zero, instance waking up"
      - name: Ping Render Ready Probe
        run: |
          curl -s -f -m 30 https://algo-code-latest.onrender.com/api/health/live || echo "API health ping completed"
