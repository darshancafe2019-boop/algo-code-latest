services:
  # 1. Python Flask Backend (Quant.OS API Engine)
  - type: web
    name: quantos-backend
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: MASTER_LIVE_TRADING
        value: "false"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: FORCE_SQLITE
        value: "false"
      - key: AUTH_REQUIRE_LOGIN
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_BOOTSTRAP_EMAIL
        sync: false
      - key: AUTH_EMAIL_FROM
        value: onboarding@resend.dev
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: AUTH_TOTP_ENCRYPTION_KEY
        sync: false
      - key: MARKET_GATEWAY_URL
        sync: false
      - key: MARKET_GATEWAY_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Market Data Gateway (Low-Latency Streaming Gateway)
  - type: web
    name: quantos-gateway
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python start_gateway.py
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MARKET_GATEWAY_HOST
        value: 0.0.0.0
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: MASTER_LIVE_TRADING
        value: "false"
      - key: ENABLE_DELTA_OPTIONS
        value: "true"
      - key: MARKET_GATEWAY_SECRET
        sync: false
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
